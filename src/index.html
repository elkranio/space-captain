<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
        <title>Overhype Phaser 3 Framework v4T</title>
        <style>
            @font-face {
                font-family: "space_captain_chakra_petch";
                src: url("/assets/fonts/web/ChakraPetch-SemiBold.ttf") format("truetype");
                font-style: normal;
                font-weight: normal;
            }

            @font-face {
                font-family: "space_captain_chakra_petch_bold";
                src: url("/assets/fonts/web/ChakraPetch-Bold.ttf") format("truetype");
                font-style: normal;
                font-weight: normal;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                background: #000;
                overflow: hidden;
                height: 100%;
            }

            #game-container {
                width: 100%;
                height: 100%;
                touch-action: none;
            }

            #turn {
                position: fixed;
                z-index: 9999;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: url('/assets/images/boot/play_portrait.png') no-repeat center center;
                background-size: contain;
                background-color: #fff;
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="game-container"></div>
        <div id="turn"></div>

        <!-- Vite entry -->
        <script type="module" src="/index.ts"></script>
    </body>
</html>
